<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Steven Compère</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:48px 0}
  .nf .wrap{position:relative;text-align:center}
  .nf h1{font-size:clamp(4rem,14vw,8rem);font-weight:500;letter-spacing:-.04em;color:var(--accent);line-height:1}
  .nf p{color:var(--ink-2);font-size:1.1rem;margin:18px 0 30px}

<body>
<main class="nf">
  <div class="hero-lattice" aria-hidden="true">
    <svg><defs><pattern id="hex" width="42" height="24.249" patternUnits="userSpaceOnUse" patternTransform="scale(1.35)"><path d="M0 12.124L7 0H21L28 12.124L21 24.249H7ZM28 12.124H42" fill="none" stroke="currentColor" stroke-width=".9"/></pattern></defs><rect width="100%" height="100%" fill="url(#hex)"/></svg>
  </div>
  <div class="wrap">
    <p class="sec-num" style="justify-content:center">Erreur · Error</p>
    <h1>404</h1>
    <p>Cette page n'existe pas.<br>This page does not exist.</p>
    <div class="actions"><a class="btn" href="/">Retour à l'accueil · Back to home</a></div>
  </div>

</html>
